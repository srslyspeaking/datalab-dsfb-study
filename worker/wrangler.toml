name = "dsfb-ai"
main = "cloudflare-worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGIN = "https://srslyspeaking.github.io"
OPENAI_MODEL = "gpt-4"

[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "7301501"

  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "SITE_RATE_LIMITER"
namespace_id = "7301502"

  [ratelimits.simple]
  limit = 30
  period = 60

# Never put OPENAI_API_KEY in this file.
# Store it with: wrangler secret put OPENAI_API_KEY
